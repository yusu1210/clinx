name: agent-benchmark

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario or all
        required: true
        default: all
        type: choice
        options: [all, campaign-cross-repo, campaign-resume-drift, campaign-confirmation]
      repeats:
        description: Independent repeats per arm (1-5)
        required: true
        default: '1'
      model:
        description: Explicit model ID for every comparison run
        required: true
        type: string
      effort:
        description: Reasoning effort
        required: true
        default: high
        type: choice
        options: [medium, high]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BENCHMARK_MODEL: ${{ inputs.model }}
    steps:
      - name: Require benchmark credential
        run: |
          if [ -z "${BENCHMARK_MODEL//[[:space:]]/}" ]; then
            echo "An explicit model ID is required; action defaults are not a comparison baseline." >&2
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required for true Codex agent runs." >&2
            exit 1
          fi

  matrix:
    needs: preflight
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: plan
        env:
          SCENARIO: ${{ inputs.scenario }}
          REPEATS: ${{ inputs.repeats }}
          BENCHMARK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BENCHMARK_REVISION: ${{ github.sha }}
          BENCHMARK_MODEL: ${{ inputs.model }}
          BENCHMARK_EFFORT: ${{ inputs.effort }}
        run: |
          matrix=$(node evals/benchmark/scripts/plan.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/run-plan.json" "$SCENARIO" "$REPEATS")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: experiment-plan
          path: ${{ runner.temp }}/run-plan.json
          if-no-files-found: error
          retention-days: 30

  prepare:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: experiment-plan
          path: ${{ runner.temp }}
      - name: Prepare isolated candidate input
        run: |
          node evals/benchmark/scripts/prepare.mjs \
            "$GITHUB_WORKSPACE" \
            "${{ matrix.scenario }}" \
            "${{ matrix.arm }}" \
            "$RUNNER_TEMP/run" \
            "$RUNNER_TEMP/run-plan.json" "${{ matrix.rep }}"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/input.tgz" run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: input-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/input.tgz
          if-no-files-found: error
          retention-days: 7

  phase1:
    needs: [matrix, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: input-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}
      - run: tar -C "$GITHUB_WORKSPACE" -xzf "$RUNNER_TEMP/input.tgz"
      - name: Record start time and expose prompt inside the isolated workspace
        run: |
          date +%s%3N > "$GITHUB_WORKSPACE/run/phase1-start-ms"
          cp "$GITHUB_WORKSPACE/run/project/request.md" "$GITHUB_WORKSPACE/benchmark-prompt.md"
      - id: agent1
        continue-on-error: true
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/run/project
          prompt-file: benchmark-prompt.md
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
      - name: Record end time, final message and runtime
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.agent1.outputs.final-message }}
        run: |
          date +%s%3N > "$GITHUB_WORKSPACE/run/phase1-end-ms"
          printf '%s\n' "${{ steps.agent1.outcome }}" > "$GITHUB_WORKSPACE/run/phase1-agent-outcome"
          printf '%s\n' "$CODEX_FINAL_MESSAGE" > "$GITHUB_WORKSPACE/run/phase1-final.md"
          codex --version > "$GITHUB_WORKSPACE/run/phase1-codex-version.txt" || true
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const value = {
            runnerOs: process.env.RUNNER_OS ?? null,
            runnerArch: process.env.RUNNER_ARCH ?? null,
            imageOs: process.env.ImageOS ?? null,
            imageVersion: process.env.ImageVersion ?? null,
            node: process.version,
          };
          writeFileSync(`${process.env.GITHUB_WORKSPACE}/run/phase1-host.json`, `${JSON.stringify(value)}\n`);
          NODE
          tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/phase1.tgz" run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/phase1.tgz
          if-no-files-found: error
          retention-days: 7

  transition:
    needs: [matrix, phase1]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: phase1-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/phase1.tgz"
      - name: Enforce phase-one design boundary
        if: matrix.scenario == 'campaign-confirmation'
        run: node evals/benchmark/scripts/check-phase1.mjs "$RUNNER_TEMP/run"
      - name: Apply evaluator-controlled transition
        if: matrix.scenario != 'campaign-cross-repo'
        run: node evals/benchmark/scripts/transition.mjs "${{ matrix.scenario }}" "$RUNNER_TEMP/run"
      - run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/transition.tgz" run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: transition-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/transition.tgz
          if-no-files-found: error
          retention-days: 7

  phase2:
    needs: [matrix, transition]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: transition-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}
      - run: tar -C "$GITHUB_WORKSPACE" -xzf "$RUNNER_TEMP/transition.tgz"
      - name: Record phase-two start and expose prompt
        if: matrix.scenario != 'campaign-cross-repo'
        run: |
          date +%s%3N > "$GITHUB_WORKSPACE/run/phase2-start-ms"
          cp "$GITHUB_WORKSPACE/run/project/request-phase2.md" "$GITHUB_WORKSPACE/benchmark-prompt.md"
      - name: Continue in a fresh Codex context
        id: agent2
        continue-on-error: true
        if: matrix.scenario != 'campaign-cross-repo'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/run/project
          prompt-file: benchmark-prompt.md
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
      - name: Record phase-two end and final message
        if: matrix.scenario != 'campaign-cross-repo'
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.agent2.outputs.final-message }}
        run: |
          date +%s%3N > "$GITHUB_WORKSPACE/run/phase2-end-ms"
          printf '%s\n' "${{ steps.agent2.outcome }}" > "$GITHUB_WORKSPACE/run/phase2-agent-outcome"
          printf '%s\n' "$CODEX_FINAL_MESSAGE" > "$GITHUB_WORKSPACE/run/phase2-final.md"
          codex --version > "$GITHUB_WORKSPACE/run/phase2-codex-version.txt" || true
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const value = {
            runnerOs: process.env.RUNNER_OS ?? null,
            runnerArch: process.env.RUNNER_ARCH ?? null,
            imageOs: process.env.ImageOS ?? null,
            imageVersion: process.env.ImageVersion ?? null,
            node: process.version,
          };
          writeFileSync(`${process.env.GITHUB_WORKSPACE}/run/phase2-host.json`, `${JSON.stringify(value)}\n`);
          NODE
      - run: tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/final.tgz" run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/final.tgz
          if-no-files-found: error
          retention-days: 7

  grade:
    needs: [matrix, phase2]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: final-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/final.tgz"
      - name: Grade hidden acceptance
        id: hidden_grade
        continue-on-error: true
        run: |
          set +e
          node evals/benchmark/scripts/grade.mjs "${{ matrix.scenario }}" "$RUNNER_TEMP/run"
          status=$?
          cp "$RUNNER_TEMP/run/grade.json"             "$RUNNER_TEMP/result-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}.json"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: result-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/result-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.rep }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve benchmark failure in job status
        if: steps.hidden_grade.outcome != 'success'
        run: exit 1

  aggregate:
    needs: [matrix, grade]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        continue-on-error: true
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: experiment-plan
          path: ${{ runner.temp }}/results
      - name: Retain every planned run, including missing results
        run: node evals/benchmark/scripts/aggregate.mjs "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-summary
          path: |
            ${{ runner.temp }}/results/aggregate.json
            ${{ runner.temp }}/results/run-plan.json
          if-no-files-found: error
          retention-days: 30
